services:
  app:
    build: .
    container_name: aplicacion
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: postgres_service
    ports:
      - "5432:5432"
    env_file:
      - .env
    restart: always